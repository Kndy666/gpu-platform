<section class="panel allocation-panel" data-timeline="{% url 'timeline' %}"><div class="section-heading"><h2>资源分配</h2><div class="timeline-controls"><button class="icon-button" data-day="-1" aria-label="前一天">‹</button><input type="date" data-timeline-date aria-label="查看日期"><button class="icon-button" data-day="1" aria-label="后一天">›</button><button class="text-button" data-today>今天</button></div></div><div class="timeline-legend"><span><i class="legend-running"></i>运行</span><span><i class="legend-finished"></i>已结束</span><span><i class="legend-reserved"></i>预约</span></div><div class="allocation-scroll"><div class="allocation-board"><div class="allocation-axis"><span></span><div>{% for x in '0123456' %}<span>{{ forloop.counter0|add:0 }}</span>{% endfor %}</div></div><div data-timeline-rows></div></div></div><div class="timeline-tooltip" hidden></div></section>
