{% if page.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a class="button secondary" href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}">← 上一页</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?page={{ page.next_page_number }}&q={{ query|urlencode }}">下一页 →</a>{% endif %}</nav>{% endif %}
