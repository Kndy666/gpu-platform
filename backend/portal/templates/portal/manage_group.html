{% extends 'portal/manage_base.html' %}
{% block manage_content %}
<form method="post" class="settings-editor" data-resource-settings>
  {% csrf_token %}{{ form.non_field_errors }}
  <section class="panel identity-editor" aria-label="用户组信息">
    <div class="group-name-row">
      {% include 'portal/field.html' with field=form.name %}
      <div class="check-fields">{% include 'portal/field.html' with field=form.make_default %}</div>
    </div>
  </section>
  {% include 'portal/resource_settings.html' %}
  <div class="editor-actions">
    <a class="button secondary" href="{% url 'manage_groups' %}">取消</a>
    <button type="submit" class="button">保存用户组</button>
  </div>
</form>
{% endblock %}
