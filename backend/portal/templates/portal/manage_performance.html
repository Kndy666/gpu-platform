{% extends 'portal/manage_base.html' %}
{% block manage_content %}
<div class="performance-toolbar"><div class="performance-refresh"><label for="performance-interval">刷新间隔</label><input id="performance-interval" data-performance-interval type="number" min="1" max="3600" step="1" value="5" inputmode="numeric" required><span>秒</span><button class="button secondary" type="button" data-performance-refresh>立即刷新</button><button class="text-button" type="button" data-performance-pause aria-pressed="false">暂停</button></div><span role="status" data-performance-status>自动刷新中</span></div>
<div data-performance-url="{% url 'manage_performance_data' %}">{% include 'portal/performance_nodes.html' %}</div>
{% endblock %}
