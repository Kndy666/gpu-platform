{% extends 'portal/manage_base.html' %}
{% block manage_actions %}<a class="button secondary" href="{% url 'manage_groups' %}">返回用户组</a>{% endblock %}
{% block manage_content %}<section class="panel group-delete"><h2>{{ group.name }}</h2><dl><dt>成员</dt><dd>{{ member_count }}</dd></dl><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}{% include 'portal/field.html' %}{% endfor %}<div class="form-actions"><button type="submit" class="button button-danger">删除用户组</button></div></form></section>{% endblock %}
