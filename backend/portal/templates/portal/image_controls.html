{% if image.state == 'ready' and not image.shared and image.owner_id %}<div class="actions">{% if image.temporary or image.recycle_after %}<form method="post" action="{% url 'image_action' image.pk 'keep' %}">{% csrf_token %}<input type="hidden" name="origin" value="{{ origin }}"><button class="text-button">长期保留</button></form>{% endif %}{% if not image.recycle_after %}<form method="post" action="{% url 'image_action' image.pk 'recycle' %}">{% csrf_token %}<input type="hidden" name="origin" value="{{ origin }}"><button class="text-button danger">回收</button></form>{% endif %}</div>{% endif %}
