name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run pytest
      - run: uv run ruff check packages modules tests
      - run: uv run mypy packages/contracts/src packages/control/src packages/node/src packages/installer/src modules/*/*/src
      - run: uv run lint-imports
      - run: uv run python -m gpu_platform_control.manage check
        env:
          DJANGO_SETTINGS_MODULE: gpu_platform_control.settings.test
      - run: uv run python -m gpu_platform_control.manage check_translations --compile
        env:
          DJANGO_SETTINGS_MODULE: gpu_platform_control.settings.test

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/panel/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  installer-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/contracts ./packages/installer pytest
      - run: python -m pytest -c /dev/null packages/contracts/tests packages/installer/tests
