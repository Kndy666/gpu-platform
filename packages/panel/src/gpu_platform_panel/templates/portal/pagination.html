{% load i18n %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% translate 'Pagination' %}">{% if page.has_previous %}<a class="button secondary" href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}">{% translate '← Previous' %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?page={{ page.next_page_number }}&q={{ query|urlencode }}">{% translate 'Next →' %}</a>{% endif %}</nav>{% endif %}
