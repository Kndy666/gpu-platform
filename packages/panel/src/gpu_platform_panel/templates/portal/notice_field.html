<div class="field{% if field.errors %} invalid{% endif %}">
  <div class="field-label-with-help">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <span class="field-hint">
      <button type="button" class="field-hint-trigger" data-notice-hint
              aria-label="{{ field.label }}" aria-describedby="{{ field.auto_id }}_helptext">?</button>
      <span class="field-tooltip" id="{{ field.auto_id }}_helptext" role="tooltip">{{ field.help_text }}</span>
    </span>
  </div>
  {{ field }}{{ field.errors }}
</div>
