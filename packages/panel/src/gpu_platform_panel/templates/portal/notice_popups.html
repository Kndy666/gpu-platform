{% load i18n %}
<div class="notice-banners" data-notice-banners aria-live="polite"></div>
<div class="notice-toasts" data-notice-toasts aria-live="polite"
     data-close-label="{% translate 'Close' %}">
  {% for message in messages %}
  <div class="notice-popup {{ message.tags }}" data-flash
       data-seconds="{% if message.level_tag == 'error' %}0{% else %}5{% endif %}">
    <p>{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% if platform_features.notifications %}
<form hidden data-notice-session data-reminders="{% url 'inbox_reminders' %}"
      data-dismiss-url="{% url 'dismiss_banner' 0 %}">
  {% csrf_token %}
</form>
{% endif %}
