{% load i18n %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% translate 'Pagination' %}">{% if page.has_previous %}<a class="button secondary" href="{{ page.previous_url }}">{% translate '← Previous' %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="{{ page.next_url }}">{% translate 'Next →' %}</a>{% endif %}</nav>{% endif %}
