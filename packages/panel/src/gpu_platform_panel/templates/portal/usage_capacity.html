{% load i18n %}
{% if capacity.available %}
<div class="usage-capacity-card" data-report-part>
  <div class="usage-ring" data-chart="capacity" data-source="usage-capacity-series" data-kind="{{ kind }}"
       data-allocated="{% translate 'Allocated' %}" data-available="{% translate 'Unallocated' %}" aria-hidden="true" hidden></div>
  <div class="usage-capacity-value">
    <span>{{ kind }}</span>
    <strong>{{ capacity.allocated|floatformat:'-2' }} <small>/ {{ capacity.available }}</small></strong>
    <span class="muted">{{ capacity.percent|floatformat:'-1' }}% {% translate 'allocated' %}</span>
  </div>
</div>
{% endif %}
