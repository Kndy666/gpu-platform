{% load i18n %}<section class="panel allocation-panel" data-timeline="{% url 'timeline' %}"><div class="section-heading"><h2>{% translate 'Resource allocation' %}</h2><div class="timeline-controls"><button class="icon-button" data-day="-1" aria-label="{% translate 'Previous day' %}">‹</button><input type="date" data-timeline-date aria-label="{% translate 'View date' %}"><button class="icon-button" data-day="1" aria-label="{% translate 'Next day' %}">›</button><button class="text-button" data-today>{% translate 'Today' %}</button></div></div><div class="timeline-legend"><span><i class="legend-running"></i>{% translate 'Run' %}</span><span><i class="legend-finished"></i>{% translate 'Ended' %}</span><span><i class="legend-reserved"></i>{% translate 'Scheduled' %}</span><span><i class="legend-queued"></i>{% translate 'Queued' %}</span></div><div class="allocation-scroll"><div class="allocation-board"><div class="allocation-axis"><span></span><div><span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>24:00</span></div></div><div data-timeline-rows></div></div></div><div class="timeline-tooltip" hidden></div></section>
