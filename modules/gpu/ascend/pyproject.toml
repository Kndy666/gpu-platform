[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-gpu-ascend"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["gpu-platform-contracts==0.4.0"]

[project.entry-points."gpu_platform.slots.gpu"]
ascend = "gpu_platform_gpu_ascend.module:Module"

[tool.setuptools.packages.find]
where = ["src"]
