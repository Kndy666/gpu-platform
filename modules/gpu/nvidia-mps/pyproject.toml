[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-gpu-nvidia-mps"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["gpu-platform-contracts==0.4.0"]

[project.entry-points."gpu_platform.slots.gpu"]
"nvidia-mps" = "gpu_platform_gpu_nvidia_mps.module:Module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "host/*", "images/*", "locale/**/*"]
