[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-auth-local"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["gpu-platform-contracts==0.4.0", "Django>=5.2,<5.3"]

[project.entry-points."gpu_platform.slots.auth"]
"local" = "gpu_platform_auth_local.module:Module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "host/*", "images/*", "locale/**/*"]
