[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-platform-storage-rawfile"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["gpu-platform-contracts==0.4.0", "PyYAML>=6,<7"]

[project.entry-points."gpu_platform.slots.storage"]
"rawfile" = "gpu_platform_storage_rawfile.module:Module"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "host/*", "images/*", "locale/**/*"]
